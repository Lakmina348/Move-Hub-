<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0a0a0f;
    color: #e8e8f0;
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .player-wrapper {
    width: 100%;
    max-width: 900px;
    background: #111118;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0,0,0,0.7);
    border: 1px solid rgba(255,255,255,0.07);
  }

  /* ── VIDEO AREA ── */
  .video-container {
    position: relative;
    width: 100%;
    padding-top: 56.25%; /* 16:9 */
    background: #000;
  }

  .video-container iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    display: block;
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 14px 18px 16px;
    background: #111118;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Timeline */
  .timeline-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .time-label {
    font-size: 12px;
    color: #888;
    white-space: nowrap;
    min-width: 80px;
    font-variant-numeric: tabular-nums;
  }

  .progress-bar-wrap {
    flex: 1;
    position: relative;
    height: 5px;
    background: rgba(255,255,255,0.12);
    border-radius: 99px;
    cursor: pointer;
    transition: height 0.15s;
  }
  .progress-bar-wrap:hover { height: 8px; }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #7c6af7, #a78bfa);
    border-radius: 99px;
    width: 0%;
    position: relative;
    pointer-events: none;
  }

  .progress-thumb {
    position: absolute;
    right: -6px;
    top: 50%;
    transform: translateY(-50%);
    width: 12px;
    height: 12px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 3px rgba(124,106,247,0.4);
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .progress-bar-wrap:hover .progress-thumb { opacity: 1; }

  /* Main controls row */
  .main-controls {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn {
    background: none;
    border: none;
    color: #ccc;
    cursor: pointer;
    width: 38px;
    height: 38px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }
  .btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
  .btn svg { display: block; }

  .btn-play {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, #7c6af7, #a78bfa);
    border-radius: 50%;
    color: #fff;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-play:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px rgba(124,106,247,0.5);
    background: linear-gradient(135deg, #7c6af7, #a78bfa);
    color: #fff;
  }

  .spacer { flex: 1; }

  /* Volume */
  .volume-wrap {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .volume-slider {
    -webkit-appearance: none;
    width: 72px;
    height: 4px;
    border-radius: 99px;
    background: rgba(255,255,255,0.15);
    outline: none;
    cursor: pointer;
  }
  .volume-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #a78bfa;
    cursor: pointer;
  }

  /* Settings panel */
  .settings-panel {
    display: none;
    position: absolute;
    bottom: 110px;
    right: 18px;
    background: #1a1a28;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 6px;
    width: 220px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
    z-index: 100;
  }
  .settings-panel.open { display: block; }

  .settings-section {
    padding: 8px 10px 4px;
  }

  .settings-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #666;
    margin-bottom: 6px;
    font-weight: 600;
  }

  .quality-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 5px;
    margin-bottom: 8px;
  }

  .quality-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px;
    color: #ccc;
    font-size: 12px;
    font-weight: 600;
    padding: 7px 4px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
  }
  .quality-btn:hover { background: rgba(124,106,247,0.2); border-color: #7c6af7; color: #fff; }
  .quality-btn.active {
    background: linear-gradient(135deg, #7c6af7, #a78bfa);
    border-color: transparent;
    color: #fff;
  }
  .quality-btn .badge {
    display: block;
    font-size: 9px;
    font-weight: 400;
    color: rgba(255,255,255,0.6);
    margin-top: 1px;
  }
  .quality-btn.active .badge { color: rgba(255,255,255,0.85); }

  .speed-row {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .speed-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #ccc;
    font-size: 11px;
    padding: 5px 8px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .speed-btn:hover { background: rgba(124,106,247,0.2); border-color: #7c6af7; color: #fff; }
  .speed-btn.active {
    background: linear-gradient(135deg, #7c6af7, #a78bfa);
    border-color: transparent;
    color: #fff;
  }

  .settings-divider {
    height: 1px;
    background: rgba(255,255,255,0.07);
    margin: 4px 0;
  }

  .settings-note {
    font-size: 10px;
    color: #555;
    padding: 6px 10px 8px;
    line-height: 1.5;
  }

  /* Quality indicator badge on control bar */
  .quality-indicator {
    font-size: 10px;
    font-weight: 700;
    color: #a78bfa;
    background: rgba(124,106,247,0.15);
    border-radius: 5px;
    padding: 3px 7px;
    letter-spacing: 0.03em;
    cursor: pointer;
    transition: background 0.15s;
  }
  .quality-indicator:hover { background: rgba(124,106,247,0.3); }

  /* Fullscreen iframe adjustments */
  .player-wrapper.fullscreen {
    position: fixed;
    inset: 0;
    max-width: 100%;
    border-radius: 0;
    z-index: 9999;
  }
  .player-wrapper.fullscreen .video-container {
    flex: 1;
    padding-top: 0;
    height: calc(100vh - 100px);
  }
  .player-wrapper.fullscreen { display: flex; flex-direction: column; }
</style>
</head>
<body>

<div class="player-wrapper" id="playerWrapper">

  <div class="video-container" id="videoContainer">
    <iframe
      id="videoFrame"
      src="https://drive.google.com/file/d/1F9RJr4H8E_T5pfFZOFWSrwiJUD8SMWR8/preview"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <!-- Settings panel (positioned relative to wrapper) -->
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-section">
      <div class="settings-label">🎬 Quality</div>
      <div class="quality-grid">
        <button class="quality-btn" onclick="setQuality('2160p', this)">
          4K
          <span class="badge">2160p</span>
        </button>
        <button class="quality-btn" onclick="setQuality('1080p', this)">
          HD
          <span class="badge">1080p</span>
        </button>
        <button class="quality-btn active" onclick="setQuality('720p', this)">
          HD
          <span class="badge">720p</span>
        </button>
        <button class="quality-btn" onclick="setQuality('480p', this)">
          SD
          <span class="badge">480p</span>
        </button>
        <button class="quality-btn" onclick="setQuality('360p', this)">
          Low
          <span class="badge">360p</span>
        </button>
        <button class="quality-btn" onclick="setQuality('240p', this)">
          Min
          <span class="badge">240p</span>
        </button>
      </div>
    </div>

    <div class="settings-divider"></div>

    <div class="settings-section">
      <div class="settings-label">⚡ Playback Speed</div>
      <div class="speed-row">
        <button class="speed-btn" onclick="setSpeed(0.5, this)">0.5×</button>
        <button class="speed-btn" onclick="setSpeed(0.75, this)">0.75×</button>
        <button class="speed-btn active" onclick="setSpeed(1, this)">1×</button>
        <button class="speed-btn" onclick="setSpeed(1.25, this)">1.25×</button>
        <button class="speed-btn" onclick="setSpeed(1.5, this)">1.5×</button>
        <button class="speed-btn" onclick="setSpeed(2, this)">2×</button>
      </div>
    </div>

    <div class="settings-divider"></div>
    <div class="settings-note">
      💡 Quality setting works when you open the video in Google Drive. The embedded player uses Drive's auto quality.
    </div>
  </div>

  <div class="controls">

    <!-- Timeline row -->
    <div class="timeline-row">
      <span class="time-label" id="timeLabel">0:00 / 0:00</span>
      <div class="progress-bar-wrap" id="progressBar" onclick="seekVideo(event)">
        <div class="progress-fill" id="progressFill">
          <div class="progress-thumb"></div>
        </div>
      </div>
    </div>

    <!-- Main controls -->
    <div class="main-controls">

      <!-- Play/Pause -->
      <button class="btn btn-play" id="playBtn" onclick="togglePlay()" title="Play / Pause (Space)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
      </button>

      <!-- Rewind 10s -->
      <button class="btn" onclick="skip(-10)" title="Rewind 10s">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
          <text x="8" y="14" font-size="5" fill="currentColor" font-family="sans-serif">10</text>
        </svg>
      </button>

      <!-- Forward 10s -->
      <button class="btn" onclick="skip(10)" title="Forward 10s">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
          <text x="8" y="14" font-size="5" fill="currentColor" font-family="sans-serif">10</text>
        </svg>
      </button>

      <!-- Volume -->
      <div class="volume-wrap">
        <button class="btn" id="muteBtn" onclick="toggleMute()" title="Mute">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" oninput="changeVolume(this.value)" title="Volume">
      </div>

      <div class="spacer"></div>

      <!-- Quality badge -->
      <span class="quality-indicator" id="qualityBadge" onclick="toggleSettings()">720p</span>

      <!-- Settings -->
      <button class="btn" onclick="toggleSettings()" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </button>

      <!-- Open in Drive -->
      <a href="https://drive.google.com/file/d/1F9RJr4H8E_T5pfFZOFWSrwiJUD8SMWR8/view" target="_blank" style="text-decoration:none;">
        <button class="btn" title="Open in Google Drive">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
        </button>
      </a>

      <!-- Fullscreen -->
      <button class="btn" onclick="toggleFullscreen()" title="Fullscreen (F)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="fsIcon">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>

    </div>
  </div>
</div>

<script>
  // ── State ──
  let isPlaying = false;
  let isMuted = false;
  let currentTime = 0;
  let duration = 0;
  let volume = 100;
  let settingsOpen = false;
  let currentQuality = '720p';
  let progressInterval = null;

  // Note: Google Drive embedded iframe has limited JS API access.
  // Controls shown here simulate UI; actual play/pause uses postMessage where supported.

  // ── Play / Pause ──
  function togglePlay() {
    isPlaying = !isPlaying;
    updatePlayIcon();

    // Try postMessage to iframe (limited support in Drive embeds)
    const iframe = document.getElementById('videoFrame');
    if (isPlaying) {
      iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
      startProgressSimulation();
    } else {
      iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
      stopProgressSimulation();
    }
  }

  function updatePlayIcon() {
    const btn = document.getElementById('playBtn');
    if (isPlaying) {
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
      btn.title = 'Pause (Space)';
    } else {
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
      btn.title = 'Play (Space)';
    }
  }

  // ── Progress simulation (Drive iframe doesn't expose time) ──
  function startProgressSimulation() {
    if (progressInterval) clearInterval(progressInterval);
    // We simulate ~5 minute video if duration unknown
    if (duration === 0) duration = 300;
    progressInterval = setInterval(() => {
      if (isPlaying) {
        currentTime = Math.min(currentTime + 1, duration);
        updateTimeline();
        if (currentTime >= duration) {
          isPlaying = false;
          updatePlayIcon();
          stopProgressSimulation();
        }
      }
    }, 1000);
  }

  function stopProgressSimulation() {
    if (progressInterval) clearInterval(progressInterval);
  }

  function updateTimeline() {
    const pct = duration > 0 ? (currentTime / duration) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('timeLabel').textContent = formatTime(currentTime) + ' / ' + formatTime(duration);
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ':' + (sec < 10 ? '0' : '') + sec;
  }

  function seekVideo(e) {
    const bar = document.getElementById('progressBar');
    const rect = bar.getBoundingClientRect();
    const pct = (e.clientX - rect.left) / rect.width;
    currentTime = Math.max(0, Math.min(duration, pct * duration));
    updateTimeline();
  }

  // ── Skip ──
  function skip(seconds) {
    currentTime = Math.max(0, Math.min(duration, currentTime + seconds));
    updateTimeline();
  }

  // ── Volume ──
  function changeVolume(val) {
    volume = parseInt(val);
    isMuted = volume === 0;
    updateMuteIcon();
  }

  function toggleMute() {
    isMuted = !isMuted;
    const slider = document.getElementById('volumeSlider');
    slider.value = isMuted ? 0 : volume;
    updateMuteIcon();
  }

  function updateMuteIcon() {
    const btn = document.getElementById('muteBtn');
    if (isMuted) {
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`;
    } else {
      btn.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
    }
  }

  // ── Quality ──
  function setQuality(q, btn) {
    currentQuality = q;
    document.getElementById('qualityBadge').textContent = q;
    document.querySelectorAll('.quality-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    // Reload iframe with quality param (Drive supports sz param for some resolutions)
    // For Drive, the quality is mostly auto — but we label it for UI clarity
    // and open a hint in a toast
    showToast('Quality set to ' + q + '. Opens at best available in Drive embed.');
  }

  // ── Speed ──
  function setSpeed(s, btn) {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    showToast('Speed: ' + s + '×');
    // postMessage for speed (limited Drive support)
    const iframe = document.getElementById('videoFrame');
    iframe.contentWindow.postMessage(JSON.stringify({event:'command',func:'setPlaybackRate',args:[s]}), '*');
  }

  // ── Settings ──
  function toggleSettings() {
    settingsOpen = !settingsOpen;
    document.getElementById('settingsPanel').classList.toggle('open', settingsOpen);
  }

  // Close settings on outside click
  document.addEventListener('click', function(e) {
    const panel = document.getElementById('settingsPanel');
    const badge = document.getElementById('qualityBadge');
    const settingsBtn = document.querySelector('.btn[onclick="toggleSettings()"]');
    if (settingsOpen && !panel.contains(e.target) && e.target !== badge && !settingsBtn.contains(e.target)) {
      settingsOpen = false;
      panel.classList.remove('open');
    }
  });

  // ── Fullscreen ──
  let isFullscreen = false;
  function toggleFullscreen() {
    const wrapper = document.getElementById('playerWrapper');
    if (!isFullscreen) {
      if (wrapper.requestFullscreen) wrapper.requestFullscreen();
      else if (wrapper.webkitRequestFullscreen) wrapper.webkitRequestFullscreen();
      isFullscreen = true;
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
      else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      isFullscreen = false;
    }
  }

  // ── Toast ──
  function showToast(msg) {
    let toast = document.getElementById('toast');
    if (!toast) {
      toast = document.createElement('div');
      toast.id = 'toast';
      Object.assign(toast.style, {
        position: 'fixed', bottom: '30px', left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(20,20,35,0.95)', color: '#e0e0f0', padding: '10px 20px',
        borderRadius: '8px', fontSize: '13px', zIndex: '9999',
        border: '1px solid rgba(255,255,255,0.1)', backdropFilter: 'blur(12px)',
        transition: 'opacity 0.3s', whiteSpace: 'nowrap'
      });
      document.body.appendChild(toast);
    }
    toast.textContent = msg;
    toast.style.opacity = '1';
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.style.opacity = '0', 2500);
  }

  // ── Keyboard shortcuts ──
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
    if (e.code === 'ArrowLeft') skip(-10);
    if (e.code === 'ArrowRight') skip(10);
    if (e.code === 'KeyF') toggleFullscreen();
    if (e.code === 'KeyM') toggleMute();
  });

  // ── Init ──
  updateTimeline();
</script>

</body>
</html>
