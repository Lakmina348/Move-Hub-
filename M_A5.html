<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: #000;
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow: hidden;
    color: #fff;
  }

  .player-wrap {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  video {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Controls overlay */
  .controls-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(transparent, rgba(0,0,0,0.85));
    padding: 32px 16px 12px;
    opacity: 0;
    transition: opacity 0.25s;
  }
  .player-wrap:hover .controls-overlay,
  .controls-overlay.visible { opacity: 1; }

  /* Timeline */
  .timeline-wrap {
    position: relative;
    height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 99px;
    cursor: pointer;
    margin-bottom: 10px;
    transition: height 0.15s;
  }
  .timeline-wrap:hover { height: 6px; }

  .timeline-fill {
    height: 100%;
    background: #fff;
    border-radius: 99px;
    pointer-events: none;
    position: relative;
  }
  .timeline-thumb {
    position: absolute;
    right: -5px; top: 50%;
    transform: translateY(-50%);
    width: 11px; height: 11px;
    background: #fff;
    border-radius: 50%;
    opacity: 0;
    transition: opacity 0.15s;
    pointer-events: none;
  }
  .timeline-wrap:hover .timeline-thumb { opacity: 1; }

  /* Bottom row */
  .bottom-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .cbtn {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    width: 36px; height: 36px;
    border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
    padding: 0;
  }
  .cbtn:hover { background: rgba(255,255,255,0.15); }
  .cbtn svg { display: block; }

  .time-display {
    font-size: 12px;
    color: rgba(255,255,255,0.85);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    min-width: 90px;
  }

  .spacer { flex: 1; }

  /* Volume */
  .vol-wrap { display: flex; align-items: center; gap: 5px; }
  .vol-slider {
    -webkit-appearance: none;
    width: 60px; height: 3px;
    border-radius: 99px;
    background: rgba(255,255,255,0.3);
    outline: none; cursor: pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 11px; height: 11px;
    border-radius: 50%;
    background: #fff;
    cursor: pointer;
  }

  /* Speed badge */
  .speed-badge {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    background: rgba(255,255,255,0.12);
    border-radius: 5px;
    padding: 3px 7px;
    cursor: pointer;
    border: none;
    font-family: inherit;
    transition: background 0.15s;
  }
  .speed-badge:hover { background: rgba(255,255,255,0.22); }

  /* Settings panel */
  .settings-panel {
    position: absolute;
    bottom: 70px; right: 10px;
    background: rgba(18,18,24,0.97);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 8px;
    width: 230px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.7);
    display: none;
    backdrop-filter: blur(12px);
  }
  .settings-panel.open { display: block; }

  .s-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #555;
    font-weight: 700;
    padding: 6px 8px 4px;
  }

  .quality-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 4px;
    padding: 0 4px 8px;
  }

  .qbtn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px;
    color: #bbb;
    font-size: 11px;
    font-weight: 700;
    padding: 7px 2px 5px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    font-family: inherit;
  }
  .qbtn small {
    display: block;
    font-size: 9px;
    font-weight: 400;
    color: #555;
    margin-top: 1px;
  }
  .qbtn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .qbtn.active {
    background: #fff;
    border-color: transparent;
    color: #000;
  }
  .qbtn.active small { color: #444; }

  .s-divider { height: 1px; background: rgba(255,255,255,0.07); margin: 2px 0 6px; }

  .speed-row {
    display: flex; gap: 4px; flex-wrap: wrap;
    padding: 0 4px 6px;
  }
  .spbtn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 6px;
    color: #bbb;
    font-size: 11px;
    padding: 5px 9px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .spbtn:hover { background: rgba(255,255,255,0.14); color: #fff; }
  .spbtn.active { background: #fff; border-color: transparent; color: #000; }

  /* Big play button center */
  .center-play {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    border: none;
    color: #fff;
    backdrop-filter: blur(4px);
    transition: background 0.2s, transform 0.15s;
    opacity: 0;
  }
  .player-wrap.paused .center-play { opacity: 1; }
  .center-play:hover { background: rgba(255,255,255,0.28); transform: translate(-50%,-50%) scale(1.08); }

  /* Rotate */
  video { transition: transform 0.35s ease; }
  .rot-0   { transform: rotate(0deg);   }
  .rot-90  { transform: rotate(90deg);  }
  .rot-180 { transform: rotate(180deg); }
  .rot-270 { transform: rotate(270deg); }

  /* Error */
  .error-msg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    text-align: center;
    color: #aaa;
    font-size: 14px;
    display: none;
  }
  .error-msg a { color: #7c9ef7; }
</style>
</head>
<body>
<div class="player-wrap paused" id="pw">

  <video id="vid" preload="metadata"
    src="https://drive.google.com/uc?export=download&id=1F9RJr4H8E_T5pfFZOFWSrwiJUD8SMWR8">
  </video>

  <div class="error-msg" id="errMsg">
    ⚠️ Video load නුවේ.<br><small>Drive sharing settings check කරන්න.</small>
  </div>

  <!-- Center play -->
  <button class="center-play" id="centerPlay" onclick="togglePlay()">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
  </button>

  <!-- Settings panel -->
  <div class="settings-panel" id="settingsPanel">
    <div class="s-label">🎬 Quality</div>
    <div class="quality-grid" id="qualityGrid">
      <button class="qbtn" onclick="setQuality('2160p',this)">4K<small>2160p</small></button>
      <button class="qbtn" onclick="setQuality('1080p',this)">FHD<small>1080p</small></button>
      <button class="qbtn active" onclick="setQuality('720p',this)">HD<small>720p</small></button>
      <button class="qbtn" onclick="setQuality('480p',this)">SD<small>480p</small></button>
      <button class="qbtn" onclick="setQuality('360p',this)">Low<small>360p</small></button>
      <button class="qbtn" onclick="setQuality('auto',this)">Auto<small>auto</small></button>
    </div>
    <div class="s-divider"></div>
    <div class="s-label">⚡ Speed</div>
    <div class="speed-row">
      <button class="spbtn" onclick="setSpeed(0.5,this)">0.5×</button>
      <button class="spbtn" onclick="setSpeed(0.75,this)">0.75×</button>
      <button class="spbtn active" onclick="setSpeed(1,this)">1×</button>
      <button class="spbtn" onclick="setSpeed(1.5,this)">1.5×</button>
      <button class="spbtn" onclick="setSpeed(2,this)">2×</button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-overlay" id="ctrlOverlay">

    <div class="timeline-wrap" id="tlWrap">
      <div class="timeline-fill" id="tlFill" style="width:0%">
        <div class="timeline-thumb"></div>
      </div>
    </div>

    <div class="bottom-row">
      <!-- Play/Pause -->
      <button class="cbtn" id="playBtn" onclick="togglePlay()" title="Space">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Skip back -->
      <button class="cbtn" onclick="skip(-10)" title="-10s">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/>
        </svg>
      </button>

      <!-- Skip forward -->
      <button class="cbtn" onclick="skip(10)" title="+10s">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/>
        </svg>
      </button>

      <!-- Time -->
      <span class="time-display" id="timeDisp">0:00 / 0:00</span>

      <div class="spacer"></div>

      <!-- Volume -->
      <div class="vol-wrap">
        <button class="cbtn" id="muteBtn" onclick="toggleMute()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="100" value="100" oninput="setVol(this.value)">
      </div>

      <!-- Speed badge -->
      <button class="speed-badge" id="speedBadge" onclick="toggleSettings()">1×</button>

      <!-- Settings ⚙️ -->
      <button class="cbtn" onclick="toggleSettings()" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.74,8.87C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.07,0.94l-2.03,1.58c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.47-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/>
        </svg>
      </button>

      <!-- Rotate -->
      <button class="cbtn" onclick="rotateVid()" title="Rotate">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M7.47 21.49C4.2 19.93 1.86 16.76 1.5 13H0c.51 6.16 5.66 11 11.95 11 .23 0 .44-.02.66-.03L9.95 21.3l-2.48.19zM12.05 0c-.23 0-.44.02-.66.03l2.66 2.67 2.48-.19C19.8 4.07 22.14 7.24 22.5 11H24C23.49 4.84 18.34 0 12.05 0zM16 10H8c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2z"/></svg>
      </button>

      <!-- Fullscreen -->
      <button class="cbtn" onclick="toggleFS()" title="F">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" id="fsIco">
          <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
const vid = document.getElementById('vid');
const pw  = document.getElementById('pw');

// ── Error handling ──
vid.addEventListener('error', () => {
  document.getElementById('errMsg').style.display = 'block';
  vid.style.display = 'none';
});

// ── Auto-hide controls ──
let hideTimer;
pw.addEventListener('mousemove', showControls);
pw.addEventListener('touchstart', showControls);
function showControls() {
  document.getElementById('ctrlOverlay').classList.add('visible');
  clearTimeout(hideTimer);
  hideTimer = setTimeout(() => {
    if (!settingsOpen) document.getElementById('ctrlOverlay').classList.remove('visible');
  }, 3000);
}

// ── Play / Pause ──
function togglePlay() {
  if (vid.paused) { vid.play(); pw.classList.remove('paused'); }
  else            { vid.pause(); pw.classList.add('paused'); }
  updatePlayBtn();
}

function updatePlayBtn() {
  const btn = document.getElementById('playBtn');
  if (vid.paused) {
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>`;
  } else {
    btn.innerHTML = `<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
  }
}

vid.addEventListener('ended', () => { pw.classList.add('paused'); updatePlayBtn(); });

// ── Timeline ──
vid.addEventListener('timeupdate', () => {
  const pct = vid.duration ? (vid.currentTime / vid.duration) * 100 : 0;
  document.getElementById('tlFill').style.width = pct + '%';
  document.getElementById('timeDisp').textContent = fmt(vid.currentTime) + ' / ' + fmt(vid.duration || 0);
});

document.getElementById('tlWrap').addEventListener('click', e => {
  const r = e.currentTarget.getBoundingClientRect();
  vid.currentTime = ((e.clientX - r.left) / r.width) * vid.duration;
});

function fmt(s) {
  if (isNaN(s)) return '0:00';
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
  return (h ? h+':' : '') + (h ? String(m).padStart(2,'0') : m) + ':' + String(sec).padStart(2,'0');
}

function skip(n) { vid.currentTime = Math.max(0, Math.min(vid.duration||0, vid.currentTime+n)); }

// ── Volume ──
function setVol(v) {
  vid.volume = v/100;
  vid.muted = v==0;
  updateMuteBtn();
}
function toggleMute() {
  vid.muted = !vid.muted;
  document.getElementById('volSlider').value = vid.muted ? 0 : vid.volume*100;
  updateMuteBtn();
}
function updateMuteBtn() {
  const btn = document.getElementById('muteBtn');
  btn.innerHTML = vid.muted
    ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>`
    : `<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>`;
}

// ── Speed ──
function setSpeed(s, btn) {
  vid.playbackRate = s;
  document.querySelectorAll('.spbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('speedBadge').textContent = s + '×';
}

// ── Quality (label only — HTML5 video has one src) ──
function setQuality(q, btn) {
  document.querySelectorAll('.qbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  // For real quality switching, HLS/DASH stream needed. Label it for now.
  showToast('Quality: ' + q);
}

// ── Settings ──
let settingsOpen = false;
function toggleSettings() {
  settingsOpen = !settingsOpen;
  document.getElementById('settingsPanel').classList.toggle('open', settingsOpen);
  if (settingsOpen) document.getElementById('ctrlOverlay').classList.add('visible');
}
document.addEventListener('click', e => {
  const panel = document.getElementById('settingsPanel');
  if (settingsOpen && !panel.contains(e.target) &&
      !e.target.closest('[onclick="toggleSettings()"]') &&
      e.target.id !== 'speedBadge') {
    settingsOpen = false;
    panel.classList.remove('open');
  }
});

// ── Rotate ──
let rotDeg = 0;
const rotClasses = ['rot-0','rot-90','rot-180','rot-270'];
function rotateVid() {
  vid.classList.remove(rotClasses[rotDeg % 4]);
  rotDeg = (rotDeg + 1) % 4;
  vid.classList.add(rotClasses[rotDeg]);
}

// ── Fullscreen ──
function toggleFS() {
  if (!document.fullscreenElement) {
    pw.requestFullscreen && pw.requestFullscreen();
  } else {
    document.exitFullscreen && document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const ico = document.getElementById('fsIco');
  ico.innerHTML = document.fullscreenElement
    ? `<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>`
    : `<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>`;
});

// ── Keyboard ──
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code==='Space') { e.preventDefault(); togglePlay(); }
  if (e.code==='ArrowLeft')  skip(-10);
  if (e.code==='ArrowRight') skip(10);
  if (e.code==='KeyM') toggleMute();
  if (e.code==='KeyF') toggleFS();
});

// ── Toast ──
function showToast(msg) {
  let t = document.getElementById('_toast');
  if (!t) {
    t = document.createElement('div');
    t.id = '_toast';
    Object.assign(t.style, {
      position:'fixed', bottom:'80px', left:'50%', transform:'translateX(-50%)',
      background:'rgba(0,0,0,0.8)', color:'#fff', padding:'8px 16px',
      borderRadius:'8px', fontSize:'13px', zIndex:'9999',
      backdropFilter:'blur(8px)', transition:'opacity 0.3s', whiteSpace:'nowrap'
    });
    document.body.appendChild(t);
  }
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(() => t.style.opacity='0', 2000);
}
</script>
</body>
</html>
