<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Video Player</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --accent: #4f8ef7;
    --bg: #0d0d0d;
    --card: #161622;
    --border: rgba(255,255,255,0.08);
    --text: #e8e8f0;
    --muted: #666;
  }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    overflow-x: hidden;
  }

  /* ── VIDEO ── */
  .video-wrap {
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    background: #000;
  }
  .video-wrap iframe {
    position: absolute;
    inset: 0; width: 100%; height: 100%;
    border: none;
  }

  /* Fullscreen button overlay */
  .fs-btn {
    position: absolute;
    bottom: 10px; right: 10px;
    background: rgba(0,0,0,0.6);
    border: none; color: #fff;
    width: 38px; height: 38px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    backdrop-filter: blur(6px);
    z-index: 10;
    transition: background 0.2s;
  }
  .fs-btn:hover { background: rgba(79,142,247,0.7); }

  /* Fullscreen mode */
  body.fs-mode .video-wrap {
    position: fixed;
    inset: 0;
    padding-top: 0;
    width: 100vw;
    height: 100vh;
    z-index: 9999;
  }
  body.fs-mode .video-wrap iframe {
    position: absolute;
    inset: 0; width: 100%; height: 100%;
  }
  body.fs-mode .fs-btn { bottom: 14px; right: 14px; }
  body.fs-mode .below-video { display: none; }

  /* ── BELOW VIDEO ── */
  .below-video {
    padding: 20px 16px 40px;
    max-width: 640px;
    margin: 0 auto;
  }

  /* ── MESSAGE FORM ── */
  .msg-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  .msg-card h3 {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  /* Step */
  .step {
    display: none;
    flex-direction: column;
    gap: 12px;
    animation: fadeIn 0.3s ease;
  }
  .step.active { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .step-label {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  input[type="text"], input[type="tel"], textarea {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 11px 14px;
    outline: none;
    transition: border-color 0.2s;
    resize: none;
  }
  input:focus, textarea:focus {
    border-color: var(--accent);
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }

  .btn-row {
    display: flex;
    gap: 8px;
  }

  .btn-next {
    flex: 1;
    background: var(--accent);
    border: none;
    border-radius: 10px;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 12px;
    cursor: pointer;
    font-family: inherit;
    transition: opacity 0.2s, transform 0.15s;
  }
  .btn-next:hover { opacity: 0.88; transform: translateY(-1px); }
  .btn-next:active { transform: scale(0.97); }

  .btn-skip {
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--muted);
    font-size: 13px;
    padding: 12px 16px;
    cursor: pointer;
    font-family: inherit;
    transition: background 0.2s;
  }
  .btn-skip:hover { background: rgba(255,255,255,0.1); color: var(--text); }

  /* Success */
  .success-msg {
    text-align: center;
    padding: 8px 0 4px;
  }
  .success-msg .icon {
    font-size: 36px;
    margin-bottom: 8px;
  }
  .success-msg p {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
  }
  .success-msg strong { color: var(--text); }

  /* Sending spinner */
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Progress dots */
  .progress-dots {
    display: flex;
    gap: 5px;
    margin-bottom: 14px;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.done { background: var(--accent); transform: scale(1.2); }
</style>
</head>
<body>

<!-- VIDEO -->
<div class="video-wrap" id="videoWrap">
  <iframe
    src="https://drive.google.com/file/d/1F9RJr4H8E_T5pfFZOFWSrwiJUD8SMWR8/preview?sz=w1920"
    allow="autoplay; fullscreen; picture-in-picture"
    allowfullscreen>
  </iframe>

  <button class="fs-btn" onclick="toggleFS()" id="fsBtn" title="Fullscreen">
    <svg id="fsIco" width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
      <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
    </svg>
  </button>
</div>

<!-- BELOW VIDEO -->
<div class="below-video">
  <div class="msg-card">
    <h3>💬 අපට Message එකක් යවන්න</h3>

    <!-- Progress dots -->
    <div class="progress-dots">
      <div class="dot done" id="d1"></div>
      <div class="dot" id="d2"></div>
      <div class="dot" id="d3"></div>
    </div>

    <!-- Step 1: Name -->
    <div class="step active" id="step1">
      <div class="step-label">ඔයාගේ නම දාන්න</div>
      <input type="text" id="inputName" placeholder="නම" maxlength="50">
      <div class="btn-row">
        <button class="btn-next" onclick="goStep2()">ඊළඟ →</button>
      </div>
    </div>

    <!-- Step 2: Phone (optional) -->
    <div class="step" id="step2">
      <div class="step-label">ඔයාගේ Phone Number (ස්වේච්ඡාවෙන්)</div>
      <input type="tel" id="inputPhone" placeholder="+94 77 123 4567" maxlength="20">
      <div class="btn-row">
        <button class="btn-skip" onclick="goStep3()">Skip</button>
        <button class="btn-next" onclick="goStep3()">ඊළඟ →</button>
      </div>
    </div>

    <!-- Step 3: Question -->
    <div class="step" id="step3">
      <div class="step-label">ඔයාගේ ප්‍රශ්නය හෝ Message</div>
      <textarea id="inputMsg" rows="4" placeholder="ප්‍රශ්නය ලියන්න..."></textarea>
      <div class="btn-row">
        <button class="btn-next" id="sendBtn" onclick="sendMessage()">යවන්න ✈</button>
      </div>
    </div>

    <!-- Success -->
    <div class="step" id="stepDone">
      <div class="success-msg">
        <div class="icon">✅</div>
        <p><strong>Message එක ගිහිල්ලා!</strong><br>ඉක්මනටම reply කරනවා 🙏</p>
      </div>
    </div>

  </div>
</div>

<script>
  const BOT = '8524435746:AAGpGH-ygNIUIsn9NGFZBsMUaKDDRpus8eI';
  const CID = '7883989086';

  // ── Steps ──
  function showStep(n) {
    ['step1','step2','step3','stepDone'].forEach(s => {
      document.getElementById(s).classList.remove('active');
    });
    document.getElementById('step'+n).classList.add('active');
    // dots
    document.getElementById('d1').classList.toggle('done', n>=1);
    document.getElementById('d2').classList.toggle('done', n>=2);
    document.getElementById('d3').classList.toggle('done', n>=3);
  }

  function goStep2() {
    const name = document.getElementById('inputName').value.trim();
    if (!name) { document.getElementById('inputName').focus(); return; }
    showStep(2);
    document.getElementById('inputPhone').focus();
  }

  function goStep3() {
    showStep(3);
    document.getElementById('inputMsg').focus();
  }

  async function sendMessage() {
    const name  = document.getElementById('inputName').value.trim() || 'නැත';
    const phone = document.getElementById('inputPhone').value.trim() || 'දී නැත';
    const msg   = document.getElementById('inputMsg').value.trim();
    if (!msg) { document.getElementById('inputMsg').focus(); return; }

    const btn = document.getElementById('sendBtn');
    btn.innerHTML = '<span class="spinner"></span> යවනවා...';
    btn.disabled = true;

    const text = `📩 නව Message\n\n👤 නම: ${name}\n📞 Phone: ${phone}\n\n💬 Message:\n${msg}`;

    try {
      await fetch(`https://api.telegram.org/bot${BOT}/sendMessage`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chat_id: CID, text })
      });
      showStep('Done');
    } catch(e) {
      btn.innerHTML = 'නැවත try කරන්න';
      btn.disabled = false;
    }
  }

  // ── Enter key ──
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      const s1 = document.getElementById('step1');
      const s2 = document.getElementById('step2');
      if (s1.classList.contains('active')) { e.preventDefault(); goStep2(); }
      if (s2.classList.contains('active')) { e.preventDefault(); goStep3(); }
    }
  });

  // ── Fullscreen ──
  function toggleFS() {
    document.body.classList.toggle('fs-mode');
    const ico = document.getElementById('fsIco');
    if (document.body.classList.contains('fs-mode')) {
      ico.innerHTML = `<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>`;
    } else {
      ico.innerHTML = `<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>`;
    }
  }

  // Esc to exit fs
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.body.classList.contains('fs-mode')) toggleFS();
  });
</script>
</body>
</html>
