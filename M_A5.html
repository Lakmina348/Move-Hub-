<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Video Player | Lakmina Cinema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #000; color: #fff; }

        .navbar { padding: 15px 5%; background: rgba(0,0,0,0.9); display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; z-index: 1000; }
        .logo { color: #fff; font-size: 20px; font-weight: bold; text-decoration: none; }
        .back-btn { color: white; text-decoration: none; background: #333; padding: 6px 15px; border-radius: 4px; font-size: 14px; }

        .player-section { padding-top: 80px; max-width: 800px; margin: 0 auto; padding-left: 10px; padding-right: 10px; }

        .video-box {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
        }

        /* iframe එක හරියටම box එක ඇතුලේ පිරෙන සේ */
        .video-box iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .movie-details { margin-top: 20px; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 12px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; cursor: pointer; border: none; font-size: 14px; }
        .btn-rotate { background: #fbc02d; color: #000; }
        .btn-refresh { background: #444; color: #fff; }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="#" class="logo">Lakmina Cinema</a>
        <a href="home1.html" class="back-btn">Back</a>
    </nav>

    <div class="player-section">
        <div class="video-box">
            <iframe 
                id="main-frame"
                src="https://drive.google.com/file/d/1F9RJr4H8E_T5pfFZOFWSrwiJUD8SMWR8/preview" 
                allow="autoplay; fullscreen" 
                allowfullscreen>
            </iframe>
        </div>

        <div class="movie-details">
            <h1>නරඹන චිත්‍රපටය</h1>
            <p>Full Screen සහ Quality සැකසුම් සඳහා පහත බොත්තම ඔබන්න.</p>
            <div class="btn-group">
                <button class="btn btn-rotate" onclick="playFullRotate()">Rotate & Full Screen</button>
                <button class="btn btn-refresh" onclick="location.reload()">Refresh</button>
            </div>
        </div>
    </div>

    <script>
        function playFullRotate() {
            const iframe = document.getElementById('main-frame');
            
            // iframe එක කෙලින්ම Fullscreen කිරීම (එවිට ප්ලේයරයේ පාලක තීරුව පෙනේ)
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            }
            
            // Landscape mode සැකසීම
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(err => console.log(err));
            }
        }
    </script>
</body>
</html>
